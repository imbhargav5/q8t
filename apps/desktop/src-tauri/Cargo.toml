[package]
name = "q8t-desktop"
version = "0.0.1"
description = "q8t Desktop Application"
authors = ["q8t"]
edition = "2021"

[lib]
name = "q8t_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-os = "2"

# Workspace crates
q8t-core = { path = "../../../packages/q8t-core" }
q8t-db = { path = "../../../packages/q8t-db" }
q8t-crypto = { path = "../../../packages/q8t-crypto" }
x-client = { path = "../../../packages/x-client" }

# Workspace dependencies
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sqlx.workspace = true

# HTTP server
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-extra = { version = "0.10", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Utilities
rand = "0.8"
hex = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSThread"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSScreen", "NSRunningApplication", "NSWorkspace"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
