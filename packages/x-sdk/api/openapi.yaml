components:
  schemas:
    Tweet:
      type: object
      required:
        - id
        - text
      properties:
        id:
          type: string
        text:
          type: string
        author_id:
          type: string
        created_at:
          type: string
          format: date-time
        edit_history_tweet_ids:
          type: array
          items:
            type: string
          description: Array of Tweet IDs representing the edit history
        conversation_id:
          type: string
        in_reply_to_user_id:
          type: string
        referenced_tweets:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [retweeted, quoted, replied_to]
              id:
                type: string
        attachments:
          type: object
          properties:
            media_keys:
              type: array
              items:
                type: string
            poll_ids:
              type: array
              items:
                type: string
        public_metrics:
          $ref: "#/components/schemas/TweetPublicMetrics"
        entities:
          $ref: "#/components/schemas/TweetEntities"
        context_annotations:
          type: array
          items:
            type: object
        lang:
          type: string
        source:
          type: string
        possibly_sensitive:
          type: boolean
        reply_settings:
          type: string
          enum: [everyone, mentionedUsers, following, other]

    TweetPublicMetrics:
      type: object
      properties:
        retweet_count:
          type: integer
        reply_count:
          type: integer
        like_count:
          type: integer
        quote_count:
          type: integer
        bookmark_count:
          type: integer
        impression_count:
          type: integer

    TweetEntities:
      type: object
      properties:
        hashtags:
          type: array
          items:
            $ref: "#/components/schemas/Hashtag"
        mentions:
          type: array
          items:
            $ref: "#/components/schemas/Mention"
        urls:
          type: array
          items:
            $ref: "#/components/schemas/UrlEntity"
        cashtags:
          type: array
          items:
            type: object
            properties:
              start:
                type: integer
              end:
                type: integer
              tag:
                type: string
        annotations:
          type: array
          items:
            type: object
            properties:
              start:
                type: integer
              end:
                type: integer
              probability:
                type: number
              type:
                type: string
              normalized_text:
                type: string

    Hashtag:
      type: object
      properties:
        start:
          type: integer
        end:
          type: integer
        tag:
          type: string

    Mention:
      type: object
      properties:
        start:
          type: integer
        end:
          type: integer
        username:
          type: string
        id:
          type: string

    UrlEntity:
      type: object
      properties:
        start:
          type: integer
        end:
          type: integer
        url:
          type: string
        expanded_url:
          type: string
        display_url:
          type: string
        title:
          type: string
        description:
          type: string
        unwound_url:
          type: string
        images:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              width:
                type: integer
              height:
                type: integer

    User:
      type: object
      required:
        - id
        - name
        - username
      properties:
        id:
