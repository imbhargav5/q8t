openapi: 3.0.0
info:
  title: X (Twitter) API
  version: "2"
  description: X API v2 endpoints
  # API Reference: https://docs.x.com/x-api/introduction

servers:
  - url: https://api.twitter.com/2

paths:
  /tweets:
    post:
      operationId: createTweet
      summary: Create a tweet
      # Docs: https://docs.x.com/x-api/posts/create-post
      externalDocs:
        description: X API Documentation - Create Post
        url: https://docs.x.com/x-api/posts/create-post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTweetRequest"
      responses:
        "201":
          description: Tweet created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TweetResponse"

  /tweets/{id}:
    get:
      operationId: getTweet
      summary: Get a tweet by ID
      # Docs: https://docs.x.com/x-api/posts/get-post-by-id
      externalDocs:
        description: X API Documentation - Get Post by ID
        url: https://docs.x.com/x-api/posts/get-post-by-id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: tweet.fields
          in: query
          schema:
            type: string
          description: Comma-separated list of Tweet fields to display
        - name: expansions
          in: query
          schema:
            type: string
          description: Comma-separated list of expansions
        - name: media.fields
          in: query
          schema:
            type: string
          description: Comma-separated list of media fields
        - name: poll.fields
          in: query
          schema:
            type: string
          description: Comma-separated list of poll fields
        - name: user.fields
          in: query
          schema:
            type: string
          description: Comma-separated list of user fields
        - name: place.fields
          in: query
          schema:
            type: string
          description: Comma-separated list of place fields
      responses:
        "200":
          description: Tweet retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TweetResponse"
    delete:
      operationId: deleteTweet
      summary: Delete a tweet
      # Docs: https://docs.x.com/x-api/posts/delete-post
      externalDocs:
        description: X API Documentation - Delete Post
        url: https://docs.x.com/x-api/posts/delete-post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tweet deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteTweetResponse"

  /users/me:
    get:
      operationId: getMe
      summary: Get authenticated user
      # Docs: https://docs.x.com/x-api/users/get-my-user
      externalDocs:
        description: X API Documentation - Get My User
        url: https://docs.x.com/x-api/users/get-my-user
      parameters:
        - name: user.fields
          in: query
          schema:
            type: string
          description: Comma-separated list of user fields
        - name: expansions
          in: query
          schema:
            type: string
          description: Comma-separated list of expansions
        - name: tweet.fields
          in: query
          schema:
            type: string
          description: Comma-separated list of tweet fields
      responses:
        "200":
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

  /users/{id}:
    get:
      operationId: getUser
      summary: Get user by ID
      # Docs: https://docs.x.com/x-api/users/get-user-by-id
      externalDocs:
        description: X API Documentation - Get User by ID
        url: https://docs.x.com/x-api/users/get-user-by-id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: user.fields
          in: query
          schema:
            type: string
          description: Comma-separated list of user fields
        - name: expansions
          in: query
          schema:
            type: string
          description: Comma-separated list of expansions
        - name: tweet.fields
          in: query
          schema:
            type: string
          description: Comma-separated list of tweet fields
      responses:
        "200":
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

  /users/by/username/{username}:
    get:
      operationId: getUserByUsername
      summary: Get user by username
      # Docs: https://docs.x.com/x-api/users/get-user-by-username
      externalDocs:
        description: X API Documentation - Get User by Username
        url: https://docs.x.com/x-api/users/get-user-by-username
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: user.fields
          in: query
          schema:
            type: string
          description: Comma-separated list of user fields
        - name: expansions
          in: query
          schema:
            type: string
          description: Comma-separated list of expansions
        - name: tweet.fields
          in: query
          schema:
            type: string
          description: Comma-separated list of tweet fields
      responses:
        "200":
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

  /users/{id}/tweets:
    get:
      operationId: getUserTweets
      summary: Get tweets by user ID
      # Docs: https://docs.x.com/x-api/posts/user-posts-timeline-by-user-id
      externalDocs:
        description: X API Documentation - User Posts Timeline
        url: https://docs.x.com/x-api/posts/user-posts-timeline-by-user-id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: max_results
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: pagination_token
          in: query
          schema:
            type: string
        - name: since_id
          in: query
          schema:
            type: string
          description: Returns results with a Tweet ID greater than this ID
        - name: until_id
          in: query
          schema:
            type: string
          description: Returns results with a Tweet ID less than this ID
        - name: start_time
          in: query
          schema:
            type: string
            format: date-time
          description: YYYY-MM-DDTHH:mm:ssZ format
        - name: end_time
          in: query
          schema:
            type: string
            format: date-time
          description: YYYY-MM-DDTHH:mm:ssZ format
        - name: tweet.fields
          in: query
          schema:
            type: string
        - name: expansions
          in: query
          schema:
            type: string
        - name: media.fields
          in: query
          schema:
            type: string
        - name: poll.fields
          in: query
          schema:
            type: string
        - name: user.fields
          in: query
          schema:
            type: string
        - name: place.fields
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Tweets retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TweetsResponse"

  /users/{id}/followers:
    get:
      operationId: getFollowers
      summary: Get followers of a user
      # Docs: https://docs.x.com/x-api/users/followers-by-user-id
      externalDocs:
        description: X API Documentation - Get Followers
        url: https://docs.x.com/x-api/users/followers-by-user-id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: max_results
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: pagination_token
          in: query
          schema:
            type: string
        - name: user.fields
          in: query
          schema:
            type: string
        - name: expansions
          in: query
          schema:
            type: string
        - name: tweet.fields
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Followers retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersResponse"

  /users/{id}/following:
    get:
      operationId: getFollowing
      summary: Get users that a user is following
      # Docs: https://docs.x.com/x-api/users/following-by-user-id
      externalDocs:
        description: X API Documentation - Get Following
        url: https://docs.x.com/x-api/users/following-by-user-id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: max_results
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: pagination_token
          in: query
          schema:
            type: string
        - name: user.fields
          in: query
          schema:
            type: string
        - name: expansions
          in: query
          schema:
            type: string
        - name: tweet.fields
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Following retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersResponse"
    post:
      operationId: followUser
      summary: Follow a user
      # Docs: https://docs.x.com/x-api/users/follow-user
      externalDocs:
        description: X API Documentation - Follow User
        url: https://docs.x.com/x-api/users/follow-user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the authenticated source user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FollowRequest"
      responses:
        "200":
          description: User followed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FollowResponse"

  /users/{id}/liked_tweets:
    get:
      operationId: getLikedTweets
      summary: Get tweets liked by a user
      # Docs: https://docs.x.com/x-api/users/get-liked-posts
      externalDocs:
        description: X API Documentation - Get Liked Posts
        url: https://docs.x.com/x-api/users/get-liked-posts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: max_results
          in: query
          schema:
            type: integer
            minimum: 5
            maximum: 100
          description: Range is 5-100, not 1-100
        - name: pagination_token
          in: query
          schema:
            type: string
        - name: tweet.fields
          in: query
          schema:
            type: string
        - name: expansions
          in: query
          schema:
            type: string
        - name: media.fields
          in: query
          schema:
            type: string
        - name: poll.fields
          in: query
          schema:
            type: string
        - name: user.fields
          in: query
          schema:
            type: string
        - name: place.fields
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Liked tweets retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TweetsResponse"

  /users/{id}/likes:
    post:
      operationId: likeTweet
      summary: Like a tweet
      # Docs: https://docs.x.com/x-api/posts/like-post
      externalDocs:
        description: X API Documentation - Like Post
        url: https://docs.x.com/x-api/posts/like-post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LikeTweetRequest"
      responses:
        "200":
          description: Tweet liked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResponse"

  /users/{id}/retweets:
    post:
      operationId: retweet
      summary: Retweet a tweet
      # Docs: https://docs.x.com/x-api/posts/repost-post
      externalDocs:
        description: X API Documentation - Repost Post
        url: https://docs.x.com/x-api/posts/repost-post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetweetRequest"
      responses:
        "200":
          description: Tweet retweeted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetweetResponse"

  /users/{id}/likes/{tweet_id}:
    delete:
      operationId: unlikeTweet
      summary: Unlike a tweet
      # Docs: https://docs.x.com/x-api/posts/unlike-post
      externalDocs:
        description: X API Documentation - Unlike Post
        url: https://docs.x.com/x-api/posts/unlike-post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the authenticated user
        - name: tweet_id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the tweet to unlike
      responses:
        "200":
          description: Tweet unliked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlikeResponse"

  /users/{id}/retweets/{source_tweet_id}:
    delete:
      operationId: unretweet
      summary: Remove a retweet
      # Docs: https://docs.x.com/x-api/users/unrepost-post
      externalDocs:
        description: X API Documentation - Unrepost Post
        url: https://docs.x.com/x-api/users/unrepost-post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the authenticated user
        - name: source_tweet_id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the tweet to unretweet
      responses:
        "200":
          description: Retweet removed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnretweetResponse"

  /users/{source_user_id}/following/{target_user_id}:
    delete:
      operationId: unfollowUser
      summary: Unfollow a user
      # Docs: https://docs.x.com/x-api/users/unfollow-user
      externalDocs:
        description: X API Documentation - Unfollow User
        url: https://docs.x.com/x-api/users/unfollow-user
      parameters:
        - name: source_user_id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the authenticated user
        - name: target_user_id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the user to unfollow
      responses:
        "200":
          description: User unfollowed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnfollowResponse"

  /users/{id}/bookmarks:
    get:
      operationId: getBookmarks
      summary: Get bookmarked tweets
      # Docs: https://docs.x.com/x-api/bookmarks/bookmarks-by-user
      externalDocs:
        description: X API Documentation - Get Bookmarks
        url: https://docs.x.com/x-api/bookmarks/bookmarks-by-user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: max_results
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: pagination_token
          in: query
          schema:
            type: string
        - name: tweet.fields
          in: query
          schema:
            type: string
        - name: expansions
          in: query
          schema:
            type: string
        - name: media.fields
          in: query
          schema:
            type: string
        - name: poll.fields
          in: query
          schema:
            type: string
        - name: user.fields
          in: query
          schema:
            type: string
        - name: place.fields
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Bookmarks retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TweetsResponse"
    post:
      operationId: bookmarkTweet
      summary: Bookmark a tweet
      # Docs: https://docs.x.com/x-api/bookmarks/add-post-to-bookmarks
      externalDocs:
        description: X API Documentation - Add Bookmark
        url: https://docs.x.com/x-api/bookmarks/add-post-to-bookmarks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookmarkRequest"
      responses:
        "200":
          description: Tweet bookmarked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookmarkResponse"

  /users/{id}/bookmarks/{tweet_id}:
    delete:
      operationId: removeBookmark
      summary: Remove a bookmark
      # Docs: https://docs.x.com/x-api/bookmarks/remove-a-bookmarked-post
      externalDocs:
        description: X API Documentation - Remove Bookmark
        url: https://docs.x.com/x-api/bookmarks/remove-a-bookmarked-post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the authenticated user
        - name: tweet_id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the tweet to remove from bookmarks
      responses:
        "200":
          description: Bookmark removed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoveBookmarkResponse"

  /users/{id}/blocking:
    get:
      operationId: getBlockedUsers
      summary: Get blocked users
      # Docs: https://docs.x.com/x-api/users/get-blocked-users
      externalDocs:
        description: X API Documentation - Get Blocked Users
        url: https://docs.x.com/x-api/users/get-blocked-users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: max_results
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: pagination_token
          in: query
          schema:
            type: string
        - name: user.fields
          in: query
          schema:
            type: string
        - name: expansions
          in: query
          schema:
            type: string
        - name: tweet.fields
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Blocked users retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersResponse"
    post:
      operationId: blockUser
      summary: Block a user
      # Docs: https://docs.x.com/x-api/users/block-user
      externalDocs:
        description: X API Documentation - Block User
        url: https://docs.x.com/x-api/users/block-user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockRequest"
      responses:
        "200":
          description: User blocked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockResponse"

  /users/{source_user_id}/blocking/{target_user_id}:
    delete:
      operationId: unblockUser
      summary: Unblock a user
      # Docs: https://docs.x.com/x-api/users/unblock-user
      externalDocs:
        description: X API Documentation - Unblock User
        url: https://docs.x.com/x-api/users/unblock-user
      parameters:
        - name: source_user_id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the authenticated user
        - name: target_user_id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the user to unblock
      responses:
        "200":
          description: User unblocked successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnblockResponse"

  /users/{id}/muting:
    get:
      operationId: getMutedUsers
      summary: Get muted users
      # Docs: https://docs.x.com/x-api/users/get-muted-users
      externalDocs:
        description: X API Documentation - Get Muted Users
        url: https://docs.x.com/x-api/users/get-muted-users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: max_results
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
        - name: pagination_token
          in: query
          schema:
            type: string
        - name: user.fields
          in: query
          schema:
            type: string
        - name: expansions
          in: query
          schema:
            type: string
        - name: tweet.fields
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Muted users retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsersResponse"
    post:
      operationId: muteUser
      summary: Mute a user
      # Docs: https://docs.x.com/x-api/users/mute-user-by-user-id
      externalDocs:
        description: X API Documentation - Mute User
        url: https://docs.x.com/x-api/users/mute-user-by-user-id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MuteRequest"
      responses:
        "200":
          description: User muted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MuteResponse"

  /users/{source_user_id}/muting/{target_user_id}:
    delete:
      operationId: unmuteUser
      summary: Unmute a user
      # Docs: https://docs.x.com/x-api/users/unmute-user
      externalDocs:
        description: X API Documentation - Unmute User
        url: https://docs.x.com/x-api/users/unmute-user
      parameters:
        - name: source_user_id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the authenticated user
        - name: target_user_id
          in: path
          required: true
          schema:
            type: string
          description: The ID of the user to unmute
      responses:
        "200":
          description: User unmuted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnmuteResponse"

  /users/{id}/mentions:
    get:
      operationId: getUserMentions
      summary: Get tweets mentioning a user
      # Docs: https://docs.x.com/x-api/posts/user-mention-timeline-by-user-id
      externalDocs:
        description: X API Documentation - User Mention Timeline
        url: https://docs.x.com/x-api/posts/user-mention-timeline-by-user-id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: max_results
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: pagination_token
          in: query
          schema:
            type: string
        - name: since_id
          in: query
          schema:
            type: string
          description: Returns results with a Tweet ID greater than this ID
        - name: until_id
          in: query
          schema:
            type: string
          description: Returns results with a Tweet ID less than this ID
        - name: start_time
          in: query
          schema:
            type: string
            format: date-time
        - name: end_time
          in: query
          schema:
            type: string
            format: date-time
        - name: tweet.fields
          in: query
          schema:
            type: string
        - name: expansions
          in: query
          schema:
            type: string
        - name: media.fields
          in: query
          schema:
            type: string
        - name: poll.fields
          in: query
          schema:
            type: string
        - name: user.fields
          in: query
          schema:
            type: string
        - name: place.fields
          in: query
          schema:
            type: string
      responses:
