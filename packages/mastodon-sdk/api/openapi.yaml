  # ============================================================
  # ADMIN DOMAIN BLOCKS API - Manage Domain Blocks (Admin Only)
  # ============================================================

  /v1/admin/domain_blocks:
    get:
      operationId: adminGetDomainBlocks
      summary: Get domain blocks (admin)
      description: Get list of blocked domains
      security:
        - bearerAuth: []
      parameters:
        - name: max_id
          in: query
          schema:
            type: string
        - name: since_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: Domain blocks retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

    post:
      operationId: adminCreateDomainBlock
      summary: Block domain (admin)
      description: Block a domain
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - domain
              properties:
                domain:
                  type: string
                severity:
                  type: string
                  enum: [silence, suspend, noop]
                reject_media:
                  type: boolean
                reject_reports:
                  type: boolean
                private_comment:
                  type: string
                public_comment:
                  type: string
                obfuscate:
                  type: boolean
      responses:
        "200":
          description: Domain blocked
          content:
            application/json:
              schema:
                type: object

  /v1/admin/domain_blocks/{id}:
    get:
      operationId: adminGetDomainBlock
      summary: Get domain block (admin)
      description: Get details of a domain block
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
