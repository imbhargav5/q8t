openapi: "3.0.0"
info:
  title: Mastodon API
  version: "4.3"
  description: Comprehensive Mastodon API SDK covering all endpoints with OAuth 2.0 PKCE authentication

servers:
  - url: https://{instanceUrl}/api
    variables:
      instanceUrl:
        default: mastodon.social
        description: Mastodon instance domain (e.g., mastodon.social, mas.to, mastodon.online)

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth2

  schemas:
    # Core Account Schema
    Account:
      type: object
      properties:
        id:
          type: string
          description: The account ID
        username:
          type: string
          description: The username of the account, not including domain
        acct:
          type: string
          description: The Webfinger account URI (username@domain)
        display_name:
          type: string
          description: The account's display name
        locked:
          type: boolean
          description: Whether the account manually approves follow requests
        bot:
          type: boolean
          description: Whether the account is a bot
        discoverable:
          type: boolean
          description: Whether the account is discoverable
        group:
          type: boolean
          description: Whether the account is a group
        created_at:
          type: string
          format: date-time
        note:
          type: string
          description: Bio/description of the account (HTML)
        url:
          type: string
          description: The profile URL
        avatar:
          type: string
          description: Avatar image URL
        avatar_static:
          type: string
          description: Static avatar image URL
        header:
          type: string
          description: Header image URL
        header_static:
          type: string
          description: Static header image URL
        followers_count:
          type: integer
        following_count:
          type: integer
        statuses_count:
          type: integer
        last_status_at:
          type: string
          format: date
        emojis:
          type: array
          items:
            $ref: "#/components/schemas/CustomEmoji"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/Field"

    # Status Schema (Post)
    Status:
      type: object
      properties:
        id:
          type: string
        uri:
          type: string
        created_at:
          type: string
          format: date-time
        account:
          $ref: "#/components/schemas/Account"
        content:
          type: string
          description: HTML content
        visibility:
          type: string
          enum: [public, unlisted, private, direct]
        sensitive:
          type: boolean
        spoiler_text:
          type: string
        media_attachments:
          type: array
          items:
            $ref: "#/components/schemas/MediaAttachment"
        mentions:
          type: array
          items:
            $ref: "#/components/schemas/Mention"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        emojis:
          type: array
          items:
            $ref: "#/components/schemas/CustomEmoji"
        reblogs_count:
          type: integer
        favourites_count:
          type: integer
        replies_count:
          type: integer
        url:
          type: string
        in_reply_to_id:
          type: string
        in_reply_to_account_id:
          type: string
        reblog:
          $ref: "#/components/schemas/Status"
        poll:
          $ref: "#/components/schemas/Poll"
        card:
          $ref: "#/components/schemas/PreviewCard"
        language:
          type: string
        text:
          type: string
          description: Plain text source
        edited_at:
          type: string
          format: date-time
        favourited:
          type: boolean
        reblogged:
          type: boolean
        muted:
          type: boolean
        bookmarked:
          type: boolean
        pinned:
          type: boolean

    # Notification Schema
    Notification:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - mention
            - status
            - reblog
            - follow
            - favourite
            - poll
            - update
            - admin.sign_up
            - admin.report
        created_at:
          type: string
          format: date-time
        account:
          $ref: "#/components/schemas/Account"
        status:
          $ref: "#/components/schemas/Status"

    # Media Attachment Schema
    MediaAttachment:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [image, video, gifv, audio, unknown]
        url:
          type: string
        preview_url:
          type: string
        remote_url:
          type: string
        text_url:
          type: string
        meta:
          type: object
        description:
          type: string
        blurhash:
          type: string

    # Poll Schema
    Poll:
      type: object
      properties:
        id:
          type: string
        expires_at:
          type: string
          format: date-time
        expired:
          type: boolean
        multiple:
          type: boolean
        votes_count:
          type: integer
        voters_count:
          type: integer
        voted:
          type: boolean
        own_votes:
          type: array
          items:
            type: integer
        options:
          type: array
          items:
            $ref: "#/components/schemas/PollOption"
        emojis:
          type: array
          items:
            $ref: "#/components/schemas/CustomEmoji"

    PollOption:
      type: object
      properties:
        title:
          type: string
        votes_count:
          type: integer

    # Custom Emoji Schema
    CustomEmoji:
      type: object
      properties:
        shortcode:
          type: string
        url:
          type: string
        static_url:
          type: string
        visible_in_picker:
          type: boolean
        category:
          type: string

    # Field Schema (Profile Metadata)
    Field:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        verified_at:
          type: string
          format: date-time

    # Mention Schema
    Mention:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        url:
          type: string
        acct:
          type: string

    # Tag Schema (Hashtag)
    Tag:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
        history:
          type: array
          items:
            $ref: "#/components/schemas/TagHistory"

    TagHistory:
      type: object
      properties:
        day:
          type: string
        uses:
          type: string
        accounts:
          type: string

    # Preview Card Schema
    PreviewCard:
      type: object
      properties:
        url:
          type: string
        title:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [link, photo, video, rich]
        author_name:
          type: string
        author_url:
          type: string
        provider_name:
          type: string
        provider_url:
          type: string
        html:
          type: string
        width:
          type: integer
        height:
          type: integer
        image:
          type: string
        embed_url:
          type: string
        blurhash:
          type: string

    # Relationship Schema
    Relationship:
      type: object
      properties:
        id:
          type: string
        following:
          type: boolean
        showing_reblogs:
          type: boolean
        notifying:
          type: boolean
        followed_by:
          type: boolean
        blocking:
          type: boolean
        blocked_by:
          type: boolean
        muting:
          type: boolean
        muting_notifications:
          type: boolean
        requested:
          type: boolean
        domain_blocking:
          type: boolean
        endorsed:
          type: boolean
        note:
          type: string

    # List Schema
    List:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        replies_policy:
          type: string
          enum: [followed, list, none]

    # Conversation Schema
    Conversation:
      type: object
      properties:
        id:
          type: string
        unread:
          type: boolean
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"
        last_status:
          $ref: "#/components/schemas/Status"

    # Filter Schema (v2)
    Filter:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        context:
          type: array
          items:
            type: string
            enum: [home, notifications, public, thread, account]
        expires_at:
          type: string
          format: date-time
        filter_action:
          type: string
          enum: [warn, hide]
        keywords:
          type: array
          items:
            $ref: "#/components/schemas/FilterKeyword"
        statuses:
          type: array
          items:
            $ref: "#/components/schemas/FilterStatus"

    FilterKeyword:
      type: object
      properties:
        id:
          type: string
        keyword:
          type: string
        whole_word:
          type: boolean

    FilterStatus:
      type: object
      properties:
        id:
          type: string
        status_id:
          type: string

    # Instance Schema
    Instance:
      type: object
      properties:
        uri:
          type: string
        title:
          type: string
        short_description:
          type: string
        description:
          type: string
        email:
          type: string
        version:
          type: string
        languages:
          type: array
          items:
            type: string
        registrations:
          type: boolean
        approval_required:
          type: boolean
        invites_enabled:
          type: boolean
        urls:
          type: object
        stats:
          type: object
        thumbnail:
          type: string
        contact_account:
          $ref: "#/components/schemas/Account"

    # Marker Schema
    Marker:
      type: object
      properties:
        last_read_id:
          type: string
        version:
          type: integer
        updated_at:
          type: string
          format: date-time

    # Search Results Schema
    SearchResults:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"
        statuses:
          type: array
          items:
            $ref: "#/components/schemas/Status"
        hashtags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"

    # Admin Schemas
    AdminAccount:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        domain:
          type: string
        created_at:
          type: string
          format: date-time
        email:
          type: string
        ip:
          type: string
        role:
          type: string
        confirmed:
          type: boolean
        suspended:
          type: boolean
        silenced:
          type: boolean
        disabled:
          type: boolean
        approved:
          type: boolean
        account:
          $ref: "#/components/schemas/Account"

    AdminReport:
      type: object
      properties:
        id:
          type: string
        action_taken:
          type: boolean
        comment:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        account:
          $ref: "#/components/schemas/Account"
        target_account:
          $ref: "#/components/schemas/Account"
        assigned_account:
          $ref: "#/components/schemas/Account"
        action_taken_by_account:
          $ref: "#/components/schemas/Account"
        statuses:
          type: array
          items:
            $ref: "#/components/schemas/Status"

    # Scheduled Status Schema
    ScheduledStatus:
      type: object
      properties:
        id:
          type: string
        scheduled_at:
          type: string
          format: date-time
        params:
          type: object
        media_attachments:
          type: array
          items:
            $ref: "#/components/schemas/MediaAttachment"

    # Featured Tag Schema
    FeaturedTag:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        statuses_count:
          type: integer
        last_status_at:
          type: string
          format: date-time

    # Preferences Schema
    Preferences:
      type: object
      properties:
        posting:default:visibility:
          type: string
        posting:default:sensitive:
          type: boolean
        posting:default:language:
          type: string
        reading:expand:media:
          type: string
        reading:expand:spoilers:
          type: boolean

    # Announcement Schema
    Announcement:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        all_day:
          type: boolean
        published_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        read:
          type: boolean
        mentions:
          type: array
          items:
            $ref: "#/components/schemas/Mention"
        statuses:
          type: array
          items:
            $ref: "#/components/schemas/Status"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/Tag"
        emojis:
          type: array
          items:
            $ref: "#/components/schemas/CustomEmoji"
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/Reaction"

    Reaction:
      type: object
      properties:
        name:
          type: string
        count:
          type: integer
        me:
          type: boolean
        url:
          type: string
        static_url:
          type: string

paths:
  # ============================================================
  # ACCOUNTS API - Account Management and Social Interactions
  # ============================================================

  /v1/accounts/{id}:
    get:
      operationId: getAccount
      summary: View account information
      description: Get account information by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Account retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

  /v1/accounts/verify_credentials:
    get:
      operationId: verifyCredentials
      summary: Verify account credentials
      description: Get the authenticated user's account
      responses:
        "200":
          description: Credentials verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

  /v1/accounts/update_credentials:
    patch:
      operationId: updateCredentials
      summary: Update account credentials
      description: Update the authenticated user's profile
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                note:
                  type: string
                avatar:
                  type: string
                  format: binary
                header:
                  type: string
                  format: binary
                locked:
                  type: boolean
                bot:
                  type: boolean
                discoverable:
                  type: boolean
                fields_attributes:
                  type: array
                  items:
                    type: object
      responses:
        "200":
          description: Account updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

  /v1/accounts/lookup:
    get:
      operationId: lookupAccount
      summary: Lookup account by username
      description: Find an account by username@domain
      parameters:
        - name: acct
          in: query
          required: true
          schema:
            type: string
          description: The username@domain to lookup
      responses:
        "200":
          description: Account found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"

  /v1/accounts/search:
    get:
      operationId: searchAccounts
      summary: Search for accounts
      description: Search for matching accounts by username or display name
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 40
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: resolve
          in: query
          schema:
            type: boolean
          description: Attempt WebFinger lookup
        - name: following
          in: query
          schema:
            type: boolean
          description: Only accounts the user follows
      responses:
        "200":
          description: Accounts found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"

  /v1/accounts/{id}/statuses:
    get:
      operationId: getAccountStatuses
      summary: Get account statuses
      description: Get statuses from an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: max_id
          in: query
          schema:
            type: string
        - name: since_id
          in: query
          schema:
            type: string
        - name: min_id
          in: query
          schema:
            type: string
        - name: only_media
          in: query
          schema:
            type: boolean
        - name: exclude_replies
          in: query
          schema:
            type: boolean
        - name: exclude_reblogs
          in: query
          schema:
            type: boolean
        - name: pinned
          in: query
          schema:
            type: boolean
        - name: tagged
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Statuses retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Status"

  /v1/accounts/{id}/followers:
    get:
      operationId: getAccountFollowers
      summary: Get account followers
      description: Get accounts following this account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: max_id
          in: query
          schema:
            type: string
        - name: since_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 40
      responses:
        "200":
          description: Followers retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"

  /v1/accounts/{id}/following:
    get:
      operationId: getAccountFollowing
      summary: Get accounts followed
      description: Get accounts this account is following
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: max_id
          in: query
          schema:
            type: string
        - name: since_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 40
      responses:
        "200":
          description: Following retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"

  /v1/accounts/{id}/follow:
    post:
      operationId: followAccount
      summary: Follow an account
      description: Follow an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reblogs:
                  type: boolean
                  description: Show reblogs from this account
                notify:
                  type: boolean
                  description: Notify on new posts
      responses:
        "200":
          description: Relationship updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relationship"

  /v1/accounts/{id}/unfollow:
    post:
      operationId: unfollowAccount
      summary: Unfollow an account
      description: Unfollow an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Relationship updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relationship"

  /v1/accounts/{id}/block:
    post:
      operationId: blockAccount
      summary: Block an account
      description: Block an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Relationship updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relationship"

  /v1/accounts/{id}/unblock:
    post:
      operationId: unblockAccount
      summary: Unblock an account
      description: Unblock an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Relationship updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relationship"

  /v1/accounts/{id}/mute:
    post:
      operationId: muteAccount
      summary: Mute an account
      description: Mute an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notifications:
                  type: boolean
                  description: Mute notifications
                duration:
                  type: integer
                  description: Duration in seconds (0 = indefinite)
      responses:
        "200":
          description: Relationship updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relationship"

  /v1/accounts/{id}/unmute:
    post:
      operationId: unmuteAccount
      summary: Unmute an account
      description: Unmute an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Relationship updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relationship"

  /v1/accounts/{id}/pin:
    post:
      operationId: pinAccount
      summary: Feature account on profile
      description: Add account to featured profiles (endorsements)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Relationship updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relationship"

  /v1/accounts/{id}/unpin:
    post:
      operationId: unpinAccount
      summary: Unfeature account
      description: Remove account from featured profiles
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Relationship updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relationship"

  /v1/accounts/{id}/note:
    post:
      operationId: setAccountNote
      summary: Set private note on account
      description: Add a private note to an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment:
                  type: string
      responses:
        "200":
          description: Relationship updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relationship"

  /v1/accounts/{id}/remove_from_followers:
    post:
      operationId: removeFollower
      summary: Remove follower
      description: Remove an account from your followers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Relationship updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relationship"

  /v1/accounts/relationships:
    get:
      operationId: getAccountRelationships
      summary: Check relationships with accounts
      description: Get relationship information for multiple accounts
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: array
            items:
              type: string
          description: Array of account IDs
      responses:
        "200":
          description: Relationships retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Relationship"

  /v1/accounts/{id}/lists:
    get:
      operationId: getAccountLists
      summary: Get lists containing account
      description: Get lists that contain this account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lists retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/List"

  /v1/accounts/{id}/featured_tags:
    get:
      operationId: getAccountFeaturedTags
      summary: Get account featured tags
      description: Get featured tags for an account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
