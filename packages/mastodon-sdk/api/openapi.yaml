      operationId: getPushSubscription
      summary: Get push subscription
      description: Get current Web Push subscription
      responses:
        "200":
          description: Subscription retrieved
          content:
            application/json:
              schema:
                type: object

    post:
      operationId: createPushSubscription
      summary: Create push subscription
      description: Subscribe to Web Push notifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - subscription
              properties:
                subscription:
                  type: object
                  properties:
                    endpoint:
                      type: string
                    keys:
                      type: object
                data:
                  type: object
                  properties:
                    alerts:
                      type: object
      responses:
        "200":
          description: Subscription created
          content:
            application/json:
              schema:
                type: object

    put:
      operationId: updatePushSubscription
      summary: Update push subscription
      description: Update Web Push subscription settings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    alerts:
                      type: object
      responses:
        "200":
          description: Subscription updated
          content:
            application/json:
              schema:
                type: object

    delete:
      operationId: deletePushSubscription
      summary: Delete push subscription
      description: Unsubscribe from Web Push notifications
      responses:
        "200":
          description: Subscription deleted
          content:
            application/json:
              schema:
                type: object

