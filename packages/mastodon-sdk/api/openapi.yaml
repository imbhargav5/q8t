      summary: Search
      description: Search for accounts, hashtags, and statuses
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query
        - name: type
          in: query
          schema:
            type: string
            enum: [accounts, hashtags, statuses]
          description: Filter by type
        - name: resolve
          in: query
          schema:
            type: boolean
          description: Attempt WebFinger lookup
        - name: following
          in: query
          schema:
            type: boolean
          description: Only accounts the user follows
        - name: account_id
          in: query
          schema:
            type: string
          description: Filter statuses by author
        - name: exclude_unreviewed
          in: query
          schema:
            type: boolean
        - name: max_id
          in: query
          schema:
            type: string
        - name: min_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"

