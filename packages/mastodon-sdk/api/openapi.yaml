      operationId: uploadMedia
      summary: Upload media
      description: Upload media attachment (images, videos, audio)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Media file
                description:
                  type: string
                  description: Alt text
                focus:
                  type: string
                  description: Focal point (x,y coordinates)
      responses:
        "200":
          description: Media uploaded (synchronous for images)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAttachment"
        "202":
          description: Media processing (async for video/audio)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAttachment"

  /v1/media/{id}:
    get:
      operationId: getMedia
      summary: Get media attachment
