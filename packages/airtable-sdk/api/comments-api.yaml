openapi: 3.0.0
info:
  title: Airtable Comments API
  version: 1.0.0
  description: Airtable Comments API for record comments and discussions

servers:
  - url: https://api.airtable.com/v0
    description: Airtable API v0

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Personal Access Token (PAT) or OAuth token with data.recordComments scope

  schemas:
    Comment:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
        createdTime:
          type: string
          format: date-time
        lastUpdatedTime:
          type: string
          format: date-time
        mentioned:
          type: object
          additionalProperties: true
        author:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
            name:
              type: string

    CommentList:
      type: object
      properties:
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        offset:
          type: string

    CreateCommentRequest:
      type: object
      properties:
        text:
          type: string
      required:
        - text

    UpdateCommentRequest:
      type: object
      properties:
        text:
          type: string
      required:
        - text

paths:
  /{baseId}/{tableIdOrName}/{recordId}/comments:
    get:
      summary: List comments
      operationId: listComments
      parameters:
        - name: baseId
          in: path
          required: true
          schema:
            type: string
        - name: tableIdOrName
          in: path
          required: true
          schema:
            type: string
        - name: recordId
          in: path
          required: true
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: string
        - name: pageSize
          in: query
          schema:
            type: integer
            maximum: 100
      responses:
        '200':
          description: List of comments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentList'

    post:
      summary: Create comment
      operationId: createComment
      parameters:
        - name: baseId
          in: path
          required: true
          schema:
            type: string
        - name: tableIdOrName
          in: path
          required: true
          schema:
            type: string
        - name: recordId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '200':
          description: Created comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'

  /{baseId}/{tableIdOrName}/{recordId}/comments/{commentId}:
    get:
      summary: Get comment
      operationId: getComment
      parameters:
        - name: baseId
          in: path
          required: true
          schema:
            type: string
        - name: tableIdOrName
          in: path
          required: true
          schema:
            type: string
        - name: recordId
          in: path
          required: true
          schema:
            type: string
        - name: commentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Comment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'

    patch:
      summary: Update comment
      operationId: updateComment
      parameters:
        - name: baseId
          in: path
          required: true
          schema:
            type: string
        - name: tableIdOrName
          in: path
          required: true
          schema:
            type: string
        - name: recordId
          in: path
          required: true
          schema:
            type: string
        - name: commentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommentRequest'
      responses:
        '200':
          description: Updated comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'

    delete:
      summary: Delete comment
      operationId: deleteComment
      parameters:
        - name: baseId
          in: path
          required: true
          schema:
            type: string
        - name: tableIdOrName
          in: path
          required: true
          schema:
            type: string
        - name: recordId
          in: path
          required: true
          schema:
            type: string
        - name: commentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Comment deleted
